name: Pull request build and deploy
'on': pull_request
jobs:
  build:
    if: '${{ github.event.pull_request.head.repo.full_name == github.repository }}'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:run -- --coverage
      - run: npm run build
        env:
          REACT_APP_VERSION: ${{ github.sha }}
      - name: Inject dev env config
        run: cp build/config.dev.json build/config.json
      - name: Archive production artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            build

  preview_dev:
    needs: [build]
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: entur/gha-firebase/.github/workflows/firebase-hosting-preview.yml@0e0a7ed58ab5d51d1d88138cbdddb58158eaba9c # v1.2.10
    with:
      gcp_project_id: ent-ninkasi-dev
      environment: dev
      build_artifact_name: build
      build_artifact_path: build
