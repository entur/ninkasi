name: Build and deploy
'on':
  push:
    branches:
      - master
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:run -- --coverage
      - run: npm run build
        env:
          REACT_APP_VERSION: ${{ github.sha }}
      - name: Archive production artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build
          path: |
            build

  prepare_dev:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build
      - name: Copy favicon
        run: cp build/nin-d.ico build/favicon.ico
      - name: Inject env config
        run: cp build/config.dev.json build/config.json
      - name: Archive dev artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-dev
          path: |
            build

  deploy_dev:
    needs: [prepare_dev]
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: entur/gha-firebase/.github/workflows/firebase-hosting-deploy.yml@0e0a7ed58ab5d51d1d88138cbdddb58158eaba9c # v1.2.10
    with:
      gcp_project_id: ent-ninkasi-dev
      environment: dev
      build_artifact_name: build-dev
      build_artifact_path: build

  prepare_staging:
    runs-on: ubuntu-latest
    needs: [deploy_dev]
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build
      - name: Copy favicon
        run: cp build/nin-s.ico build/favicon.ico
      - name: Inject env config
        run: cp build/config.staging.json build/config.json
      - name: Archive staging artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-staging
          path: |
            build

  deploy_staging:
    needs: [prepare_staging]
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: entur/gha-firebase/.github/workflows/firebase-hosting-deploy.yml@0e0a7ed58ab5d51d1d88138cbdddb58158eaba9c # v1.2.10
    with:
      gcp_project_id: ent-ninkasi-tst
      environment: tst
      build_artifact_name: build-staging
      build_artifact_path: build

  prepare_prod:
    runs-on: ubuntu-latest
    needs: [deploy_staging]
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: build
          path: build
      - name: Copy favicon
        run: cp build/nin-p.ico build/favicon.ico
      - name: Inject env config
        run: cp build/config.prod.json build/config.json
      - name: Archive prod artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-prod
          path: |
            build

  deploy_prod:
    needs: [prepare_prod]
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: entur/gha-firebase/.github/workflows/firebase-hosting-deploy.yml@0e0a7ed58ab5d51d1d88138cbdddb58158eaba9c # v1.2.10
    with:
      gcp_project_id: ent-ninkasi-prd
      environment: prd
      build_artifact_name: build-prod
      build_artifact_path: build
