name: Production maintenance mode
on: workflow_dispatch
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Copy maintenance mode file
        run: mkdir build && cp public/maintenance.html build/index.html
      - name: Archive maintenance artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maintenance-build
          path: |
            build

  deploy_prod:
    needs: [prepare]
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    uses: entur/gha-firebase/.github/workflows/firebase-hosting-deploy.yml@0e0a7ed58ab5d51d1d88138cbdddb58158eaba9c # v1.2.10
    with:
      gcp_project_id: ent-ninkasi-prd
      environment: prd
      build_artifact_name: maintenance-build
      build_artifact_path: build
