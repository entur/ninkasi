description:
  en:
    localisedName: Ninkasi
    shortDescription: Admin console for the timetable data pipeline.
    longDescription: >
      Ninkasi is the React single-page admin console. Staff register providers and organisations, run import,
      validation, transfer and export operations, and inspect delivery and processing history. Authentication is
      OpenID Connect.
    documentation: https://github.com/entur/ninkasi/blob/master/README.md
    features:
      - Registration of data providers and organisations
      - Triggers import, validation, transfer and export
      - Delivery history and validation reports
      - User and role administration
      - OpenID Connect authentication

